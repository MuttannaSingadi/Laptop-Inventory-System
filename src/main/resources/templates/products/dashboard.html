<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card-box {
            border-radius: 15px;
            padding: 25px;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .card-box:hover {
            transform: translateY(-5px);
        }

        .bg-blue {
            background: linear-gradient(45deg, #007bff, #00c6ff);
        }

        .bg-green {
            background: linear-gradient(45deg, #28a745, #7be495);
        }

        .bg-orange {
            background: linear-gradient(45deg, #fd7e14, #ffc107);
        }

        .icon {
            font-size: 40px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">Product Dashboard</a>

    <div>
        <a href="/products" class="btn btn-outline-light">Manage Products</a>
    </div>
</nav>

<div class="container mt-5">

    <h3 class="mb-4">Dashboard Overview</h3>

    <div class="row g-4">

        <!-- Total Products -->
        <div class="col-md-4">
            <div class="card-box bg-blue">
                <div class="icon">📦</div>
                <h2 th:text="${totalProducts}">0</h2>
                <p>Total Products</p>
            </div>
        </div>

        <!-- Status -->
        <div class="col-md-4">
            <div class="card-box bg-green">
                <div class="icon">✅</div>
                <h2>Active</h2>
                <p>System Status</p>
            </div>
        </div>

        <!-- Admin -->
        <div class="col-md-4">
            <div class="card-box bg-orange">
                <div class="icon">👤</div>
                <h2>Admin</h2>
                <p>Access Level</p>
            </div>
        </div>

    </div>

    <!-- Action buttons -->
    <div class="mt-5 text-center">
        <a href="/products" class="btn btn-primary btn-lg px-5">
            Go to Product List
        </a>
    </div>

</div>

</body>
</html>
