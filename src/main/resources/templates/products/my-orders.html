<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f2f6ff, #eef2f7);
            min-height: 100vh;
        }

        .page-title {
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .card-box {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 25px;
            animation: fadeUp 0.6s ease;
        }

        table {
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(45deg, #0d6efd, #6610f2);
            color: white;
        }

        th, td {
            text-align: center;
            vertical-align: middle;
        }

        tbody tr {
            transition: 0.3s ease;
        }

        tbody tr:hover {
            background: #f5f8ff;
            transform: scale(1.01);
        }

        .badge {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 20px;
            letter-spacing: 0.4px;
        }

        .status-pending {
            background: #ffc107;
            color: #000;
        }

        .status-confirmed {
            background: #0d6efd;
        }

        .status-shipped {
            background: #0dcaf0;
            color: #000;
        }

        .status-delivered {
            background: #198754;
        }

        .empty-box {
            padding: 40px;
            text-align: center;
            color: #888;
            font-size: 18px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 25px;
            background: #0d6efd;
            color: white;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #084ec4;
            color: white;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card-box">

        <div class="top-bar">
            <h3 class="page-title">
                My Orders — <span th:text="${customer}"></span>
            </h3>

            <a href="/products/shop" class="back-btn">← Back to Shop</a>
        </div>

        <div class="table-responsive">
            <table class="table table-borderless align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Total Price</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.id}"></td>
                    <td th:text="${o.productName}"></td>
                    <td th:text="${o.quantity}"></td>
                    <td>₹ <span th:text="${o.totalPrice}"></span></td>
                    <td>
                        <span class="badge"
                              th:text="${o.status}"
                              th:classappend="
                                  ${o.status == 'PENDING'} ? 'status-pending' :
                                  (${o.status == 'CONFIRMED'} ? 'status-confirmed' :
                                  (${o.status == 'SHIPPED'} ? 'status-shipped' :
                                  (${o.status == 'DELIVERED'} ? 'status-delivered' : 'bg-secondary')))
                              ">
                        </span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="5" class="empty-box">
                        😔 No orders found yet
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
