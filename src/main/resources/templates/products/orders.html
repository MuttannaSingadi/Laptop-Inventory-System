<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h3 class="mb-4">Orders</h3>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Total Price</th>
            <th>Status</th>
            <th>Update</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>
            <td th:text="${o.productName}"></td>
            <td>₹ <span th:text="${o.unitPrice}"></span></td>
            <td th:text="${o.quantity}"></td>
            <td class="fw-bold text-success">₹ <span th:text="${o.totalPrice}"></span></td>

            <!-- Status Badge -->
            <td>
                <span class="badge"
                      th:classappend="
                          ${o.status} == 'PENDING' ? 'bg-warning' :
                          (${o.status} == 'CONFIRMED' ? 'bg-primary' :
                          (${o.status} == 'SHIPPED' ? 'bg-info' :
                          (${o.status} == 'DELIVERED' ? 'bg-success' : 'bg-secondary')))"
                      th:text="${o.status}">
                </span>
            </td>

            <!-- Update Status -->
            <td>
                <form th:action="@{/products/orders/update/{id}(id=${o.id})}" method="post">
                    <select name="status" class="form-select form-select-sm mb-1">
                        <option>PENDING</option>
                        <option>CONFIRMED</option>
                        <option>SHIPPED</option>
                        <option>DELIVERED</option>
                    </select>
                    <button class="btn btn-sm btn-primary w-100">Update</button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="7" class="text-center text-muted">
                No orders found
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
