<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

<h3 class="text-center mb-3">Product List</h3>

<form th:action="@{/products}" method="post" enctype="multipart/form-data">
    <div class="row g-2">
        <div class="col"><input name="name" class="form-control" placeholder="Name" required></div>
        <div class="col"><input name="brand" class="form-control" placeholder="Brand" required></div>
        <div class="col"><input name="category" class="form-control" placeholder="Category" required></div>
        <div class="col"><input type="number" name="price" class="form-control" placeholder="Price" required></div>
        <div class="col"><input type="file" name="image" class="form-control"></div>
        <div class="col"><button class="btn btn-success w-100">Add</button></div>
    </div>
</form>

<table class="table table-bordered table-striped mt-4">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Name</th>
        <th>Brand</th>
        <th>Category</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    	<tr th:each="p, iter : ${products}">
		    <td th:text="${iter.count}"></td>

		    <td>
		        <img th:src="@{'/uploads/' + ${p.imageFileName}}"
		             width="100" height="90" style="object-fit:cover;">
		    </td>

		    <td th:text="${p.name}"></td>
		    <td th:text="${p.brand}"></td>
		    <td th:text="${p.category}"></td>
		    <td th:text="${p.price}"></td>

		    <td>
		        <a th:href="@{/products/edit/{id}(id=${p.id})}"
		           class="btn btn-primary btn-sm">Edit</a>

		        <form th:action="@{/products/{id}(id=${p.id})}"
		              method="post"
		              style="display:inline;">
		            <input type="hidden" name="_method" value="delete"/>
		            <button class="btn btn-danger btn-sm">Delete</button>
		        </form>
		    </td>
		</tr>

    </tbody>
</table>

</div>
</body>
</html>
