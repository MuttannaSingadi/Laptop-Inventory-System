<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buy Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h3 class="mb-4">Buy Product</h3>

    <div class="card p-4 shadow">

        <div class="row">
            <div class="col-md-4">
                <img th:src="@{'/uploads/' + ${product.imageFileName}}"
                     class="img-fluid rounded"
                     alt="Product Image">
            </div>

            <div class="col-md-8">
                <h4 th:text="${product.name}"></h4>
                <p><b>Brand:</b> <span th:text="${product.brand}"></span></p>
                <p><b>Category:</b> <span th:text="${product.category}"></span></p>
                <p><b>Price:</b> ₹<span th:text="${product.price}"></span></p>

                <hr>
				<form th:action="@{/products/buy/{id}(id=${product.id})}" method="post">

				    <div class="mb-3">
				        <label>Your Name</label>
				        <input type="text" name="customerName" class="form-control" required>
				    </div>

				    <div class="mb-3">
				        <label>Quantity</label>
				        <input type="number" name="quantity" min="1" value="1" class="form-control" required>
				    </div>

				    <button class="btn btn-success">Confirm Order</button>
				</form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
