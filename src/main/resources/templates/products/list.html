<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h3>Product List</h3>
        <a href="/products/add" class="btn btn-success">+ Add Product</a>
		<a href="/products/orders" class="btn btn-info ms-2">
			    View Orders
			</a>
    </div>
	

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Image</th>
            <th>Name</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p, i : ${products}">
            <td th:text="${i.count}"></td>

            <td>
                <img th:src="@{'/uploads/' + ${p.imageFileName}}"
                     width="90" height="70" style="object-fit:cover;">
            </td>

            <td th:text="${p.name}"></td>
            <td th:text="${p.brand}"></td>
            <td th:text="${p.category}"></td>
            <td th:text="${p.price}"></td>

            <td>
                <a th:href="@{/products/edit/{id}(id=${p.id})}"
                   class="btn btn-primary btn-sm">Edit</a>

				   <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline;">
				       <button class="btn btn-danger btn-sm"
				               onclick="return confirm('Are you sure?')">
				           Delete
				       </button>
				   </form>
				   


            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
