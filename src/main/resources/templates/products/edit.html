<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h3>Edit Product</h3>

    <form th:action="@{/products/update/{id}(id=${product.id})}"
          method="post"
          enctype="multipart/form-data">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" name="name"
                   th:value="${product.name}" required>
        </div>

        <div class="mb-3">
            <label>Brand</label>
            <input type="text" class="form-control" name="brand"
                   th:value="${product.brand}" required>
        </div>

        <div class="mb-3">
            <label>Category</label>
            <input type="text" class="form-control" name="category"
                   th:value="${product.category}" required>
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number" step="0.01" class="form-control" name="price"
                   th:value="${product.price}" required>
        </div>

        <div class="mb-3">
            <label>Change Image</label>
            <input type="file" name="image" class="form-control">
        </div>

        <!-- show old image -->
        <div class="mb-3" th:if="${product.imageFileName != null}">
            <img th:src="@{'/uploads/' + ${product.imageFileName}}"
                 width="140"
                 style="border-radius:6px; border:1px solid #ddd;">
        </div>

        <button type="submit" class="btn btn-success">Update</button>
        <a href="/products" class="btn btn-secondary ms-2">Cancel</a>

    </form>

</div>

</body>
</html>
